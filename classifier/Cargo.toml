[package]
name = "file_checker"
version = "0.1.0"
edition = "2021"
description = "What is this upload really? A structural file-type check for document pipelines. No dependencies."
license = "MIT"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "file-checker"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
